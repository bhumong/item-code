services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-pages}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    env_file:
      - .env
    environment:
      PB_DATA_DIR: /pb_data
      S3_ENDPOINT: http://seaweedfs:8333
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pb-data:/pb_data
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  seaweedfs-data:
  pb-data:
