version: '3'

tasks:
  install:
    desc: Download Go tool and Flutter dependencies
    cmds:
      - go mod download
      - task: frontend-install

  frontend-install:
    internal: true
    dir: frontend
    cmds:
      - flutter pub get

  dev:
    desc: Start local services and Flutter Web
    preconditions:
      - sh: test -f .env
        msg: .env is missing. Create it from .env.example before starting development.
    cmds:
      - defer: docker compose down
      - docker compose up --build --wait --wait-timeout 180 -d
      - task: frontend-dev

  prod:
    desc: Build and start PocketBase with embedded Flutter Web
    preconditions:
      - sh: test -f .env
        msg: .env is missing. Create it from .env.example before starting production services.
    cmds:
      - task: frontend-production-build
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build --wait --wait-timeout 180 -d

  build:
    desc: Build a standalone Linux binary with embedded Flutter Web
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/amd64"}}'
    preconditions:
      - sh: test -f frontend/.dart_tool/package_config.json
        msg: Run `go tool task install` before building the standalone binary.
    cmds:
      - task: frontend-production-build
      - docker buildx build --platform={{.PLATFORM}} --target binary --output type=local,dest=dist -f backend/Dockerfile .

  upload:
    desc: Upload the standalone binary to the VPS with rsync
    vars:
      SSH_KEY: '{{.SSH_KEY | default "item-code.pem"}}'
      SSH_USER: '{{.SSH_USER | default "nonroot"}}'
      SSH_HOST: '{{.SSH_HOST | default "103.89.0.229"}}'
      REMOTE_DIR: '{{.REMOTE_DIR | default "/home/nonroot"}}'
      BINARY: '{{.BINARY | default "dist/ocr-search"}}'
      REMOTE_NAME: '{{splitList "/" .BINARY | last}}'
    preconditions:
      - sh: test -f {{.BINARY}}
        msg: "{{.BINARY}} is missing. Run go tool task build before uploading."
      - sh: test -f {{.SSH_KEY}}
        msg: "SSH key {{.SSH_KEY}} is missing. Pass SSH_KEY=path/to/key.pem."
    cmds:
      - >-
        rsync --partial --progress --checksum
        -e "ssh -i {{.SSH_KEY}} -o BatchMode=yes"
        {{.BINARY}} {{.SSH_USER}}@{{.SSH_HOST}}:{{.REMOTE_DIR}}/{{.REMOTE_NAME}}.new
      - >-
        ssh -i {{.SSH_KEY}} -o BatchMode=yes {{.SSH_USER}}@{{.SSH_HOST}}
        "mv {{.REMOTE_DIR}}/{{.REMOTE_NAME}}.new {{.REMOTE_DIR}}/{{.REMOTE_NAME}}
        && chmod 0755 {{.REMOTE_DIR}}/{{.REMOTE_NAME}}"
      - echo "Uploaded {{.REMOTE_NAME}} to {{.SSH_USER}}@{{.SSH_HOST}}:{{.REMOTE_DIR}}"

  frontend-production-build:
    internal: true
    dir: frontend
    cmds:
      - flutter build web --release --no-pub

  frontend-dev:
    internal: true
    dir: frontend
    cmds:
      - flutter run -d web-server --web-port 8080 --dart-define=BACKEND_URL=http://localhost:8090

  down:
    desc: Stop local services without deleting their data volumes
    cmds:
      - docker compose down
